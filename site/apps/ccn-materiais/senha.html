<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#073d73"><title>Criar ou redefinir senha · CCN</title><link rel="stylesheet" href="./styles.css"></head><body><header class="topbar"><a class="brand" href="./"><span class="brand-mark">CCN</span><span><b>Solicitação de Materiais</b><small>Acesso seguro</small></span></a></header><main class="login-shell"><section class="panel login-card"><div id="set-area"><span class="eyebrow">LINK TEMPORÁRIO</span><h1>Criar nova senha</h1><p class="muted">A senha deve possuir pelo menos 10 caracteres.</p><form id="password-form" class="form-stack"><label>Nova senha<input name="password" type="password" minlength="10" required autocomplete="new-password"></label><label>Confirmar senha<input name="confirmation" type="password" minlength="10" required autocomplete="new-password"></label><button class="primary">Salvar senha</button><p id="password-message" class="message"></p></form></div><div id="forgot-area" hidden><span class="eyebrow">RECUPERAÇÃO</span><h1>Esqueci minha senha</h1><p class="muted">Informe o e-mail institucional cadastrado.</p><form id="forgot-form" class="form-stack"><label>E-mail institucional<input name="email" type="email" required></label><button class="primary">Enviar link</button><p id="forgot-message" class="message"></p></form></div></section></main><script src="./demo-api.js"></script><script src="./senha.js" defer></script></body></html>
